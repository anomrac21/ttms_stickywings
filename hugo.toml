theme = '_menus_ttms'
languageCode = 'en-TT'
title = 'Sticky Wings'
baseURL = 'https://stickywings.ttmenus.com/'
enableRobotsTXT = true

# Mount theme's content (dashboard, locations, api, etc.); keep project content (defining mounts replaces default for that target)
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "themes/_menus_ttms/content"
    target = "content"

[markup]

[markup.goldmark]

[markup.goldmark.parser]
      attribute = true

[markup.goldmark.renderer]
      unsafe = true

[outputFormats]

[outputFormats.menuitemsJSON]
    mediaType = "application/json"
    baseName = "menu-items"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "JSON"]
  page = ["HTML", "JSON"]

[params]
  tier = "free"
  authServiceUrl = "https://auth.ttmenus.com"
  adsServiceUrl = "https://ads.ttmenus.com"
  notifyServiceUrl = "https://notify.ttmenus.com"
  description = "Sticky Wings — BBQ, grill, and jerk combos, sticky wings, loaded fries, pasta, burgers, and more. Movie Town Mall & Icon Plaza. View our menu and order online."

[params.ads]
    clientId = "ttms_stickywings"
    enabled = true
    apiUrl = "https://ads.ttmenus.com/api/v1"

[params.auth]
    enabled = true
    apiUrl = "https://auth.ttmenus.com/api/v1"

[params.contentManagement]
    enabled = true
    apiUrl = "https://cms.ttmenus.com/api"
    serviceUrl = "https://cms.ttmenus.com"
    clientId = "ttms_stickywings"

[params.thumbor]
    enabled = true
    url = "https://thumbor.ttmenus.com"
    sourceBaseUrl = "https://stickywings.ttmenus.com"
    menuImagesUseThumbor = false

[params.menuImageService]
    enabled = true
    apiUrl = "https://menu-images.ttmenus.com/api/v1"

[params.notifications]
    enabled = true
    apiUrl = "https://notify.ttmenus.com/api/v1"
    websocketUrl = "wss://notify.ttmenus.com/api/v1/ws/connect"
    serviceUrl = "https://notify.ttmenus.com"
    clientDomain = "stickywings.ttmenus.com"

[params.paymentService]
    enabled = false
    apiUrl = "https://pay.stickywings.ttmenus.com"
    clientId = "ttms_stickywings"
    currency = "TTD"
    provider = "wipay"

[params.features]
    payments = false
    delivery = false
    notifications = true
    analytics_access = false
    featured = false
    exclusive_ads = false
    no_competitor_ads = false
    unmetered_traffic = false

[params.posintegration]
    enabled = false
    provider = ""
    api_url = ""
    access_token = ""
    store_id = ""
    sync_menu = false
    auto_process_orders = false
    fallback_to_whatsapp = true

[params.orderingsystem]
    enabled = true
    orderingDisabledMessage = "Ordering is not available for this menu at this time."
    vat = 0
    servicecharge = 0
    hastables = true
    usephonecall = false
    whatsapp = 18687258135
    phone = 18687258135

[params.services]
    analyticsid = "0"
    notifications = true

[params.social]
    youtube = ""
    email = "stickywings.hr1@gmail.com"
    phone = 18687258135
    facebook = ""
    instagram = ""
    tiktok = ""

[privacy]

[privacy.instagram]
    simple = false
    disable = false

[taxonomies]
  ingredient = "ingredients"
  cookingmethod = "cookingmethods"
  tag = "tags"
  category = "categories"
  subcategory = "subcategories"
  type = "types"
  event = "events"
